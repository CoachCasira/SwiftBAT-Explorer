name: Applica correzioni UI spettroscopia e metadati

on:
  push:
    branches:
      - feature/analysis-population-1.3.0
    paths:
      - scripts/apply_spectroscopy_metadata_ui_fix.py
      - .github/workflows/apply-spectroscopy-metadata-ui-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4
        with:
          ref: feature/analysis-population-1.3.0
          fetch-depth: 0

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Applica correzioni
        run: python3 scripts/apply_spectroscopy_metadata_ui_fix.py

      - name: Verifica Maven
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Rimuove file temporanei
        run: |
          rm scripts/apply_spectroscopy_metadata_ui_fix.py
          rm .github/workflows/apply-spectroscopy-metadata-ui-fix.yml

      - name: Commit e push
        run: |
          git config user.name "CoachCasira"
          git config user.email "146272372+CoachCasira@users.noreply.github.com"
          git add -A
          git commit -m "Migliora grafico spettrale e guida metadati"
          git push origin HEAD:feature/analysis-population-1.3.0
