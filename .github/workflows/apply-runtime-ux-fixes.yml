name: Apply runtime UX fixes

on:
  push:
    paths:
      - 'scripts/apply-runtime-ux-fixes.py'
      - '.github/workflows/apply-runtime-ux-fixes.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/analysis-population-1.3.0
          fetch-depth: 0
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Apply runtime corrections
        run: python3 scripts/apply-runtime-ux-fixes.py
      - name: Maven verify
        run: mvn -B verify
      - name: Remove temporary patch files
        run: |
          rm -f scripts/apply-runtime-ux-fixes.py
          rm -f .github/workflows/apply-runtime-ux-fixes.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Corregge runtime compare, filtri e fullscreen EN'
            git push origin HEAD:feature/analysis-population-1.3.0
          fi
