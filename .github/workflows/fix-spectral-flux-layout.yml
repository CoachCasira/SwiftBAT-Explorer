name: Corregge vista flusso spettroscopico

on:
  push:
    branches:
      - feature/analysis-population-1.3.0
    paths:
      - .github/workflows/fix-spectral-flux-layout.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4
        with:
          ref: feature/analysis-population-1.3.0
          fetch-depth: 0

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Corregge flusso energetico e semplifica risultati
        shell: python
        run: |
          from pathlib import Path
          import re

          spectroscopy = Path('src/main/java/it/casiraghi/swiftbat/ui/SpectroscopyPane.java')
          text = spectroscopy.read_text(encoding='utf-8')

          pattern = re.compile(
              r'\n\s*GridPane lower = responsiveGrid\(1180, 3,\s*'
              r'buildParameterCard\(result, fit, model\),\s*'
              r'buildFluxTable\(fluxes\),\s*'
              r'buildAssistant\(result, fit, model, fluxes\)\);\s*',
              re.MULTILINE
          )
          text, count = pattern.subn('\n\n', text, count=1)
          if count != 1:
              raise SystemExit('Blocco dettagli inferiori spettroscopia non trovato')

          old_children = 'content.getChildren().addAll(metrics, readingIntro, charts, lower, scientificNote);'
          new_children = 'content.getChildren().addAll(metrics, readingIntro, charts, scientificNote);'
          if old_children not in text:
              raise SystemExit('Lista contenuti risultati ufficiali non trovata')
          text = text.replace(old_children, new_children, 1)

          old_value_label = '"Flusso [10⁻¹² erg cm⁻² s⁻¹]");'
          new_value_label = '"Flusso energetico [10⁻¹² erg cm⁻² s⁻¹]");'
          if old_value_label not in text:
              raise SystemExit('Etichetta flusso dataset 3D non trovata')
          text = text.replace(old_value_label, new_value_label, 1)
          spectroscopy.write_text(text, encoding='utf-8')

          renderer = Path('src/main/java/it/casiraghi/swiftbat/ui/components/Java2DGroupedBarPanel.java')
          text = renderer.read_text(encoding='utf-8')
          old_axis = 'g.drawString("Numero di GRB", (float) yEnd.getX() - 40, (float) yEnd.getY() - 12);'
          new_axis = '''String yLabel = dataset.valueLabel();
          g.drawString(yLabel, (float) yEnd.getX() - 40, (float) yEnd.getY() - 12);'''
          if old_axis not in text:
              raise SystemExit('Etichetta asse Y 3D non trovata')
          text = text.replace(old_axis, new_axis, 1)
          renderer.write_text(text, encoding='utf-8')

      - name: Verifica Maven
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Rimuove workflow temporaneo
        run: git rm .github/workflows/fix-spectral-flux-layout.yml

      - name: Commit e push
        run: |
          git config user.name "CoachCasira"
          git config user.email "146272372+CoachCasira@users.noreply.github.com"
          git add src/main/java/it/casiraghi/swiftbat/ui/SpectroscopyPane.java src/main/java/it/casiraghi/swiftbat/ui/components/Java2DGroupedBarPanel.java
          git commit -m "Semplifica risultati spettroscopici e corregge asse del flusso 3D"
          git push origin HEAD:feature/analysis-population-1.3.0
