name: Apply i18n layout fixes
on:
  push:
    paths:
      - '.github/workflows/apply-i18n-layout-fixes.yml'
      - 'scripts/apply-i18n-layout-fixes.py'
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/analysis-population-1.3.0
          fetch-depth: 0
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Apply fixes
        run: python3 scripts/apply-i18n-layout-fixes.py
      - name: Correct generated source references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pop = Path('src/main/java/it/casiraghi/swiftbat/ui/PopulationPage.java')
          text = pop.read_text(encoding='utf-8')
          text = text.replace(
              '        setStatusStyle(result.accepted().isEmpty() ? "status-warning" : "status-online");',
              '        status.getStyleClass().removeAll("status-neutral", "status-online", "status-warning");\n'
              '        status.getStyleClass().add(result.accepted().isEmpty() ? "status-warning" : "status-online");')
          pop.write_text(text, encoding='utf-8')

          sky = Path('src/main/java/it/casiraghi/swiftbat/ui/SkyMapPage.java')
          text = sky.read_text(encoding='utf-8')
          text = re.sub(r'^\s*selectedCatalog\.setText\([^\n]*\);\n', '', text, flags=re.MULTILINE)
          sky.write_text(text, encoding='utf-8')
          PY
      - name: Maven verify
        run: mvn -B verify
      - name: Remove temporary files
        run: rm scripts/apply-i18n-layout-fixes.py .github/workflows/apply-i18n-layout-fixes.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sistema traduzioni dizionario e layout popolazione'
          git push origin feature/analysis-population-1.3.0