name: Apply UI polish batch

on:
  push:
    branches:
      - feature/analysis-population-1.3.0
    paths:
      - .github/workflows/apply-ui-polish-batch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/analysis-population-1.3.0
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Apply UI corrections
        run: python3 scripts/apply_ui_polish_batch_20260909.py

      - name: Maven verify
        run: mvn -B verify

      - name: Remove temporary patch files
        run: |
          rm -f scripts/apply_ui_polish_batch_20260909.py
          rm -f .github/workflows/apply-ui-polish-batch.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rifinisce UX, filtri, tabelle e localizzazione" || exit 0
          git push origin HEAD:feature/analysis-population-1.3.0
