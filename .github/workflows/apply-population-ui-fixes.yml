name: Applica correzioni interfaccia popolazione

on:
  push:
    branches:
      - feature/analysis-population-1.3.0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Applica le correzioni
        run: python3 scripts/apply_population_ui_fixes.py

      - name: Verifica Maven
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Commit e push
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migliora filtri, assistente e profilo 3D di popolazione"
          git push
