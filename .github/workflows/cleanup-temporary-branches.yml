name: Pulizia branch temporanee

on:
  push:
    branches:
      - feature/analysis-population-1.3.0
    paths:
      - .github/workflows/cleanup-temporary-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Elimina esclusivamente i riferimenti temporanei
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            tmp-ui-filter-fullscreen-work
            tmp-ui-filter-fullscreen-work-2
            tmp-ui-filter-fullscreen-work-3
            tmp-ui-filter-fullscreen-work-4
            tmp-ui-filter-fullscreen-work-5
            tmp-ui-filter-fullscreen-work-6
          )
          for branch in "${branches[@]}"; do
            curl --fail-with-body --silent --show-error \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/${branch}"
            echo "Eliminata ${branch}"
          done
