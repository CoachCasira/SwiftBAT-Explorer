name: Apply FRACEXP v2

on:
  push:
    branches:
      - feature/analysis-population-1.3.0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: python3 .github/scripts/apply_fracexp_stepper.py
      - run: mvn --batch-mode --no-transfer-progress verify
      - run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/it/casiraghi/swiftbat/ui/PopulationPage.java
          git add src/main/java/it/casiraghi/swiftbat/ui/UiFactory.java
          git add src/main/resources/app.css
          git commit -m "Sostituisce gli slider FRACEXP con selettori numerici"
          git push
