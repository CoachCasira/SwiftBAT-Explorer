name: Completa feedback relatori finale

on:
  push:
    branches:
      - feature/analysis-population-1.3.0
    paths:
      - scripts/finish_supervisor_feedback.py

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/analysis-population-1.3.0
          fetch-depth: 0
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Completa localizzazione e UI
        run: python3 scripts/finish_supervisor_feedback.py
      - name: Verifica Maven
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Completa localizzazione e feedback relatori"
          git push origin HEAD:feature/analysis-population-1.3.0
