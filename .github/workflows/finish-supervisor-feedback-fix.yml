name: Corregge localizzazione rigorosa IT EN

on:
  push:
    branches:
      - feature/analysis-population-1.3.0
    paths:
      - .github/workflows/finish-supervisor-feedback-fix.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/analysis-population-1.3.0
          fetch-depth: 0
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Applica localizzazione
        run: python3 scripts/finish_supervisor_feedback.py
      - name: Corregge regex Java
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/it/casiraghi/swiftbat/ui/I18n.java')
          s = p.read_text(encoding='utf-8')
          s = s.replace('lower.matches("[a-z0-9_./:+#%\\-]+")', 'lower.matches("[-a-z0-9_./:+#%]+")')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verifica Maven
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Pulisce workflow temporaneo
        if: success()
        run: rm -f .github/workflows/finish-supervisor-feedback-fix.yml
      - name: Commit e push
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rende rigorosa la localizzazione IT EN"
          git push origin HEAD:feature/analysis-population-1.3.0
