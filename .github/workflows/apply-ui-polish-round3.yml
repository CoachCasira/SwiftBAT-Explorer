name: Applica rifiniture UI round 3

on:
  push:
    branches:
      - feature/analysis-population-1.3.0
    paths:
      - .github/trigger-ui-polish-round3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4
        with:
          ref: feature/analysis-population-1.3.0
          fetch-depth: 0

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Applica rifiniture UI
        run: python3 .github/scripts/apply_ui_polish_round3b.py

      - name: Verifica Maven
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Salva modifiche
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java src/main/resources
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
          else
            git commit -m "Migliora export PNG, tabelle, zoom e layout fullscreen"
            git push origin HEAD:feature/analysis-population-1.3.0
          fi
