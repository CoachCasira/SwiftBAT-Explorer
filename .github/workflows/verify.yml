name: Verifica progetto Maven

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Compilazione e test Java 17
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4
        with:
          ref: feature/analysis-population-1.3.0
          fetch-depth: 0

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Applica rifiniture visuali e zoom
        run: python3 .github/scripts/apply_visual_polish_round2.py

      - name: Verifica Maven
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Salva rifiniture
        if: success()
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/it/casiraghi/swiftbat/ui/PopulationPage.java \
                  src/main/java/it/casiraghi/swiftbat/ui/SkyMapPage.java \
                  src/main/java/it/casiraghi/swiftbat/ui/AboutPage.java \
                  src/main/java/it/casiraghi/swiftbat/ui/components/ThreeDChartPane.java \
                  src/main/java/it/casiraghi/swiftbat/ui/components/Java2DWaterfallPanel.java \
                  src/main/java/it/casiraghi/swiftbat/ui/components/CelestialSpherePane.java \
                  src/main/resources/app.css
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
          else
            git commit -m "Rifinisce fullscreen, leggibilità e zoom 3D"
            git push
          fi
