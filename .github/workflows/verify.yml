name: Verifica progetto Maven

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/cross-platform-expert-bootstrap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Compilazione e test Java 17
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verifica sintassi launcher macOS esperti
        run: |
          bash -n AVVIA_ESPERTI_MAC.command
          bash -n CREA_PACCHETTO_ESPERTI_MAC.command
          bash -n CREA_PACCHETTO_RELATORI_WINDOWS_MAC.command
          bash -n CREA_PACCHETTI_DISTRIBUZIONE_MAC.command

      - name: Verifica Maven
        run: mvn --batch-mode --no-transfer-progress verify

  packaging-macos:
    name: Crea e controlla ZIP macOS/Windows
    runs-on: macos-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Genera entrambi gli ZIP
        run: bash CREA_PACCHETTI_DISTRIBUZIONE_MAC.command

      - name: Verifica struttura minima dei pacchetti e checksum
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && shasum -a 256 -c SwiftBAT-Explorer-Esperti-macOS.sha256.txt)
          (cd dist && shasum -a 256 -c SwiftBAT-Explorer-Relatori-Windows.sha256.txt)
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          for filename, launch, internal in [
              ("SwiftBAT-Explorer-Esperti-macOS.zip", "AVVIA_SWIFTBAT.command", "AVVIA_ESPERTI_MAC.command"),
              ("SwiftBAT-Explorer-Relatori-Windows.zip", "AVVIA_SWIFTBAT.bat", "AVVIA_ESPERTI_WINDOWS.ps1")
          ]:
              with ZipFile(Path("dist") / filename) as archive:
                  names = set(archive.namelist())
                  prefix = "SwiftBAT Explorer/"
                  top = {n[len(prefix):].split("/")[0] for n in names if n.startswith(prefix) and n != prefix}
                  assert top == {launch, "Applicazione"}, f"{filename}: file esterni inattesi: {top}"
                  assert prefix + launch in names
                  assert prefix + "Applicazione/pom.xml" in names
                  assert prefix + "Applicazione/" + internal in names
                  assert not any("/.swiftbat-runtime/" in n for n in names), "Runtime di sviluppo nello ZIP"
                  print("OK:", filename, "solo launcher + Applicazione/")
          PY

      - name: Testa il launcher dello ZIP Mac estratto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/swiftbat-check"
          ditto -x -k dist/SwiftBAT-Explorer-Esperti-macOS.zip "$RUNNER_TEMP/swiftbat-check"
          root="$RUNNER_TEMP/swiftbat-check/SwiftBAT Explorer"
          SWIFTBAT_PREPARE_ONLY=1 /bin/bash "$root/AVVIA_SWIFTBAT.command"
          test -x "$root/Applicazione/.swiftbat-runtime/jdk-17/bin/java"
          test -x "$root/Applicazione/.swiftbat-runtime/apache-maven-3.9.16/bin/mvn"
          test -s "$root/Applicazione/.swiftbat-runtime/logs/expert-launcher.log"

      - name: Pubblica il pacchetto Windows per i relatori
        uses: actions/upload-artifact@v7
        with:
          name: SwiftBAT-Explorer-Relatori-Windows
          path: dist/SwiftBAT-Explorer-Relatori-Windows.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Pubblica il pacchetto macOS per gli esperti
        uses: actions/upload-artifact@v7
        with:
          name: SwiftBAT-Explorer-Esperti-macOS
          path: dist/SwiftBAT-Explorer-Esperti-macOS.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

  windows-bootstrap:
    name: Testa lo ZIP Windows estratto x64
    needs: packaging-macos
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Scarica lo ZIP generato per Windows
        uses: actions/download-artifact@v8
        with:
          name: SwiftBAT-Explorer-Relatori-Windows.zip
          path: packaged
          skip-decompress: true

      - name: Estrai e valida lo script PowerShell nel pacchetto
        shell: powershell
        run: |
          Expand-Archive -LiteralPath 'packaged/SwiftBAT-Explorer-Relatori-Windows.zip' -DestinationPath 'packaged/unpacked'
          $app = Join-Path (Get-Location).Path 'packaged/unpacked/SwiftBAT Explorer/Applicazione'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $app 'AVVIA_ESPERTI_WINDOWS.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }

      - name: Esegui il BAT dello ZIP e prepara Java/Maven isolati
        shell: powershell
        run: |
          $root = Join-Path (Get-Location).Path 'packaged/unpacked/SwiftBAT Explorer'
          Push-Location $root
          try {
            & cmd.exe /d /c 'AVVIA_SWIFTBAT.bat -PrepareOnly'
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } finally { Pop-Location }

      - name: Verifica build Maven usando solo ambiente interno
        shell: powershell
        run: |
          $app = Join-Path (Get-Location).Path 'packaged/unpacked/SwiftBAT Explorer/Applicazione'
          $root = Join-Path $app '.swiftbat-runtime'
          $env:JAVA_HOME = Join-Path $root 'jdk-17'
          $env:PATH = (Join-Path $env:JAVA_HOME 'bin') + ';' + $env:PATH
          $mvn = Join-Path $root 'apache-maven-3.9.16/bin/mvn.cmd'
          $repo = Join-Path $root 'm2-repository'
          if (-not (Test-Path -LiteralPath (Join-Path $root 'logs/expert-launcher.log'))) { throw 'Log non locale' }
          Push-Location $app
          try {
            & $mvn '--batch-mode' '--no-transfer-progress' "-Dmaven.repo.local=$repo" 'verify'
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } finally { Pop-Location }


  packaging-windows-native:
    name: Genera entrambi gli ZIP su Windows nativo
    runs-on: windows-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Verifica sintassi dello script PowerShell
        shell: powershell
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location).Path 'CREA_PACCHETTI_DISTRIBUZIONE_WINDOWS.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }

      - name: Esegui il generatore Windows senza Java/Maven
        shell: powershell
        run: |
          & cmd.exe /d /c 'CREA_PACCHETTI_DISTRIBUZIONE_WINDOWS.bat <NUL'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Controlla struttura dei due ZIP, checksum, LF e permessi Unix
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression
          foreach ($p in @(
            @{Id='SwiftBAT-Explorer-Esperti-macOS'; Launcher='AVVIA_SWIFTBAT.command'; Internal='AVVIA_ESPERTI_MAC.command'},
            @{Id='SwiftBAT-Explorer-Relatori-Windows'; Launcher='AVVIA_SWIFTBAT.bat'; Internal='AVVIA_ESPERTI_WINDOWS.ps1'}
          )) {
            $zipPath = Join-Path 'dist' ($p.Id + '.zip')
            $shaPath = Join-Path 'dist' ($p.Id + '.sha256.txt')
            if (-not (Test-Path -LiteralPath $zipPath)) { throw 'Missing ZIP: ' + $zipPath }
            $sha = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ((Get-Content -LiteralPath $shaPath -Raw) -notmatch [regex]::Escape($sha)) {
              throw 'SHA-256 incorrect: ' + $shaPath
            }
            $file = [System.IO.File]::OpenRead($zipPath)
            try {
              $archive = [System.IO.Compression.ZipArchive]::new(
                $file,[System.IO.Compression.ZipArchiveMode]::Read,$true)
              try {
                $prefix = 'SwiftBAT Explorer/'
                $rootItems = @($archive.Entries | ForEach-Object {
                  $itemPath = $_.FullName
                  if ($itemPath.StartsWith($prefix)) {
                    ($itemPath.Substring($prefix.Length) -split '/')[0]
                  } else { throw 'Unexpected ZIP path: ' + $itemPath }
                } | Sort-Object -Unique)
                $expected = @('Applicazione',$p.Launcher) | Sort-Object
                if ((Compare-Object $rootItems $expected).Count -gt 0) {
                  throw 'Unexpected ZIP root items: ' + ($rootItems -join ', ')
                }
                $launcher = $archive.GetEntry($prefix + $p.Launcher)
                $internal = $archive.GetEntry($prefix + 'Applicazione/' + $p.Internal)
                if ($null -eq $launcher -or $null -eq $internal -or
                    $null -eq $archive.GetEntry($prefix + 'Applicazione/pom.xml')) {
                  throw 'Missing startup files in ' + $p.Id
                }
                if (@($archive.Entries | Where-Object { $_.FullName -match '/(\.swiftbat-runtime|target|dist)/' }).Count -gt 0) {
                  throw 'Cache/build files packaged in ' + $p.Id
                }
                if ($p.Launcher -like '*.command') {
                  $executable = ($launcher.ExternalAttributes -shr 16) -band 0x1FF
                  if (($executable -band 0x49) -ne 0x49) {
                    throw 'Missing 0755 executable permissions on Mac launcher'
                  }
                  foreach ($shellEntry in @($launcher,$internal)) {
                    $reader = New-Object System.IO.StreamReader($shellEntry.Open())
                    try { $script = $reader.ReadToEnd() } finally { $reader.Dispose() }
                    if ($script.Contains([string][char]13)) {
                      throw 'CRLF detected in macOS launcher'
                    }
                  }
                }
                Write-Host ('ZIP verificato: ' + $p.Id)
              } finally { $archive.Dispose() }
            } finally { $file.Dispose() }
          }

      - name: Pubblica Mac ZIP creato su Windows per il test macOS
        uses: actions/upload-artifact@v7
        with:
          name: SwiftBAT-macOS-created-on-Windows
          path: dist/SwiftBAT-Explorer-Esperti-macOS.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

  macos-from-windows:
    name: Verifica su Mac il pacchetto creato da Windows
    needs: packaging-windows-native
    runs-on: macos-latest
    steps:
      - name: Scarica ZIP prodotto dal generatore Windows
        uses: actions/download-artifact@v8
        with:
          name: SwiftBAT-macOS-created-on-Windows.zip
          path: packaged
          skip-decompress: true

      - name: Controlla permessi Mac e bootstrap dal pacchetto Windows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/swiftbat-generated-on-windows"
          ditto -x -k packaged/SwiftBAT-Explorer-Esperti-macOS.zip "$RUNNER_TEMP/swiftbat-generated-on-windows"
          app="$RUNNER_TEMP/swiftbat-generated-on-windows/SwiftBAT Explorer"
          test -x "$app/AVVIA_SWIFTBAT.command"
          test -x "$app/Applicazione/AVVIA_ESPERTI_MAC.command"
          bash -n "$app/AVVIA_SWIFTBAT.command"
          bash -n "$app/Applicazione/AVVIA_ESPERTI_MAC.command"
          SWIFTBAT_PREPARE_ONLY=1 /bin/bash "$app/AVVIA_SWIFTBAT.command"
          test -x "$app/Applicazione/.swiftbat-runtime/jdk-17/bin/java"
          test -x "$app/Applicazione/.swiftbat-runtime/apache-maven-3.9.16/bin/mvn"
