name: Verifica progetto Maven

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Compilazione e test Java 17
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4
        with:
          ref: feature/analysis-population-1.3.0
          fetch-depth: 0

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Applica correzioni visuali
        shell: bash
        run: |
          python3 .github/scripts/apply_visual_fixes.py
          python3 .github/scripts/fix_visual_compile.py

      - name: Verifica Maven
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Salva correzioni visuali
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/it/casiraghi/swiftbat/ui/PopulationPage.java \
                  src/main/java/it/casiraghi/swiftbat/ui/ExplorerPage.java \
                  src/main/java/it/casiraghi/swiftbat/ui/SkyMapPage.java \
                  src/main/java/it/casiraghi/swiftbat/ui/components/ThreeDChartPane.java \
                  src/main/resources/app.css
          git commit -m "Rifinisce cursore FRACEXP, grafici e mappa celeste"
          git push origin HEAD:feature/analysis-population-1.3.0
