name: Verifica progetto Maven

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Compilazione e test Java 17
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Applica layout compatto
        if: github.event.pull_request.head.sha == '4cb43c877aee5d81b1001db944c7c48d7862275b'
        run: python3 .github/scripts/apply_compact_ui.py

      - name: Verifica Maven
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Salva revisione
        if: github.event.pull_request.head.sha == '4cb43c877aee5d81b1001db944c7c48d7862275b'
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/it/casiraghi/swiftbat/ui/PopulationPage.java \
                  src/main/java/it/casiraghi/swiftbat/ui/ExplorerPage.java \
                  src/main/resources/app.css
          git commit -m "Compatta analisi di popolazione ed Esplora"
          git push origin HEAD:feature/analysis-population-1.3.0
