name: Verifica progetto Maven

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Compilazione e test Java 17
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verifica sintassi launcher macOS esperti
        run: |
          bash -n AVVIA_ESPERTI_MAC.command
          bash -n CREA_PACCHETTO_ESPERTI_MAC.command

      - name: Verifica Maven
        run: mvn --batch-mode --no-transfer-progress verify
