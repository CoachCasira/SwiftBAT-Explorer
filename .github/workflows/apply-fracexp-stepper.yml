name: Applica selettori FRACEXP

on:
  push:
    branches:
      - feature/analysis-population-1.3.0

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: esegue patch FRACEXP finale'
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Applica correzioni FRACEXP e tooltip
        run: python3 .github/scripts/apply_fracexp_stepper.py

      - name: Verifica Maven
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Commit e push
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/it/casiraghi/swiftbat/ui/PopulationPage.java
          git add src/main/java/it/casiraghi/swiftbat/ui/UiFactory.java
          git add src/main/resources/app.css
          git commit -m "Sostituisce gli slider FRACEXP con selettori numerici"
          git push
