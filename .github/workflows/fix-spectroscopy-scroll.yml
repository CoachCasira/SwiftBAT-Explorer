name: Corregge scroll spettroscopia

on:
  push:
    branches:
      - feature/analysis-population-1.3.0
    paths:
      - .github/workflows/fix-spectroscopy-scroll.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4
        with:
          ref: feature/analysis-population-1.3.0
          fetch-depth: 0

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Corregge altezza e scroll della spettroscopia
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/main/java/it/casiraghi/swiftbat/ui/SpectroscopyPane.java')
          text = path.read_text(encoding='utf-8')

          if 'tabs.setMinHeight(590);' not in text:
              raise SystemExit('tabs.setMinHeight(590) non trovato')
          text = text.replace(
              'tabs.setMinHeight(590);',
              '// Lascia che la scheda assuma l\'altezza reale del contenuto quando i grafici vengono impilati.\n'
              '        resultHost.setMinHeight(Region.USE_PREF_SIZE);\n'
              '        resultHost.setMaxHeight(Double.MAX_VALUE);\n'
              '        tabs.setMinHeight(Region.USE_PREF_SIZE);',
              1
          )

          if 'tabs.setPrefHeight(720);' not in text:
              raise SystemExit('tabs.setPrefHeight(720) non trovato')
          text = text.replace(
              'tabs.setPrefHeight(720);',
              'tabs.setPrefHeight(Region.USE_COMPUTED_SIZE);\n'
              '        tabs.setMaxHeight(Double.MAX_VALUE);',
              1
          )

          if 'VBox.setVgrow(tabs, Priority.ALWAYS);' not in text:
              raise SystemExit('VBox.setVgrow tabs non trovato')
          text = text.replace(
              'VBox.setVgrow(tabs, Priority.ALWAYS);',
              'VBox.setVgrow(tabs, Priority.NEVER);',
              1
          )

          marker = 'content.setPadding(new Insets(12, 4, 18, 4));'
          if marker not in text:
              raise SystemExit('padding risultati ufficiali non trovato')
          text = text.replace(
              marker,
              marker + '\n        content.setMinHeight(Region.USE_PREF_SIZE);\n        content.setMaxWidth(Double.MAX_VALUE);',
              1
          )

          scroll_marker = 'scroll.setFitToWidth(true);\n        scroll.setHbarPolicy(ScrollPane.ScrollBarPolicy.NEVER);'
          if scroll_marker not in text:
              raise SystemExit('configurazione ScrollPane non trovata')
          text = text.replace(
              scroll_marker,
              'scroll.setFitToWidth(true);\n'
              '        scroll.setFitToHeight(false);\n'
              '        scroll.setHbarPolicy(ScrollPane.ScrollBarPolicy.NEVER);\n'
              '        scroll.setVbarPolicy(ScrollPane.ScrollBarPolicy.AS_NEEDED);',
              1
          )

          path.write_text(text, encoding='utf-8')

      - name: Verifica Maven
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Rimuove workflow temporaneo
        run: git rm .github/workflows/fix-spectroscopy-scroll.yml

      - name: Commit e push
        run: |
          git config user.name "CoachCasira"
          git config user.email "146272372+CoachCasira@users.noreply.github.com"
          git add src/main/java/it/casiraghi/swiftbat/ui/SpectroscopyPane.java
          git commit -m "Corregge scroll e contenuti spettroscopia su finestre ridotte"
          git push origin HEAD:feature/analysis-population-1.3.0
