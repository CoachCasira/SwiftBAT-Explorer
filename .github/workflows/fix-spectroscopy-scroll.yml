name: Corregge scroll spettroscopia

on:
  push:
    branches:
      - feature/analysis-population-1.3.0
    paths:
      - .github/workflows/fix-spectroscopy-scroll.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4
        with:
          ref: feature/analysis-population-1.3.0
          fetch-depth: 0

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Corregge altezza e scroll della spettroscopia
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/main/java/it/casiraghi/swiftbat/ui/SpectroscopyPane.java')
          text = path.read_text(encoding='utf-8')

          old_tabs = '''        tabs.setMinHeight(590);
          tabs.setPrefHeight(720);
          VBox.setVgrow(tabs, Priority.ALWAYS);'''
          new_tabs = '''        // Lascia che la scheda assuma l'altezza reale del contenuto: quando i grafici
          // vengono impilati su finestre strette, lo ScrollPane esterno può così
          // raggiungere anche l'istogramma e le sezioni successive senza tagliarle.
          resultHost.setMinHeight(Region.USE_PREF_SIZE);
          resultHost.setMaxHeight(Double.MAX_VALUE);
          tabs.setMinHeight(Region.USE_PREF_SIZE);
          tabs.setPrefHeight(Region.USE_COMPUTED_SIZE);
          tabs.setMaxHeight(Double.MAX_VALUE);
          VBox.setVgrow(tabs, Priority.NEVER);'''
          if old_tabs not in text:
              raise SystemExit('Blocco TabPane atteso non trovato')
          text = text.replace(old_tabs, new_tabs, 1)

          old_content = '''        VBox content = new VBox(12);
          content.setPadding(new Insets(12, 4, 18, 4));'''
          new_content = '''        VBox content = new VBox(12);
          content.setPadding(new Insets(12, 4, 18, 4));
          content.setMinHeight(Region.USE_PREF_SIZE);
          content.setMaxWidth(Double.MAX_VALUE);'''
          if old_content not in text:
              raise SystemExit('Blocco risultati ufficiali atteso non trovato')
          text = text.replace(old_content, new_content, 1)

          old_scroll = '''        scroll.setFitToWidth(true);
          scroll.setHbarPolicy(ScrollPane.ScrollBarPolicy.NEVER);
          return scroll;'''
          new_scroll = '''        scroll.setFitToWidth(true);
          scroll.setFitToHeight(false);
          scroll.setHbarPolicy(ScrollPane.ScrollBarPolicy.NEVER);
          scroll.setVbarPolicy(ScrollPane.ScrollBarPolicy.AS_NEEDED);
          return scroll;'''
          if old_scroll not in text:
              raise SystemExit('Blocco ScrollPane atteso non trovato')
          text = text.replace(old_scroll, new_scroll, 1)

          path.write_text(text, encoding='utf-8')

      - name: Verifica Maven
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Rimuove workflow temporaneo
        run: git rm .github/workflows/fix-spectroscopy-scroll.yml

      - name: Commit e push
        run: |
          git config user.name "CoachCasira"
          git config user.email "146272372+CoachCasira@users.noreply.github.com"
          git add src/main/java/it/casiraghi/swiftbat/ui/SpectroscopyPane.java
          git commit -m "Corregge scroll e contenuti spettroscopia su finestre ridotte"
          git push origin HEAD:feature/analysis-population-1.3.0
