name: Apply global i18n and layout fixes

on:
  push:
    branches:
      - feature/analysis-population-1.3.0
    paths:
      - '.github/workflows/audit-i18n-temporary.yml'
      - 'scripts/apply-global-i18n-layout-fixes.py'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/analysis-population-1.3.0
          fetch-depth: 0
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Apply UI and i18n fixes
        run: python3 scripts/apply-global-i18n-layout-fixes.py
      - name: Maven verify and UI translation coverage
        run: mvn -B verify
      - name: Remove temporary patch files
        run: rm scripts/apply-global-i18n-layout-fixes.py .github/workflows/audit-i18n-temporary.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Completa localizzazione e riallinea filtri'
          git push origin feature/analysis-population-1.3.0
