name: Apply compare population translation fix

on:
  push:
    branches:
      - feature/analysis-population-1.3.0
    paths:
      - scripts/apply_compare_population_translation_fix.py
      - .github/workflows/apply-compare-population-translation-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/analysis-population-1.3.0
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Apply corrections
        run: python3 scripts/apply_compare_population_translation_fix.py

      - name: Maven verify
        run: mvn -B verify

      - name: Remove temporary patch files
        run: |
          rm -f scripts/apply_compare_population_translation_fix.py
          rm -f .github/workflows/apply-compare-population-translation-fix.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Stabilizza compare, layout e traduzioni"
          git push origin HEAD:feature/analysis-population-1.3.0
