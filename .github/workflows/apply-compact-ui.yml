name: Applica layout compatto

on:
  push:
    branches:
      - feature/analysis-population-1.3.0

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: avvia revisione layout compatto'
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Applica layout compatto
        run: python3 .github/scripts/apply_compact_ui.py

      - name: Verifica Maven
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Pulisci file temporanei e salva
        shell: bash
        run: |
          rm -f .github/scripts/apply_compact_ui.py .github/workflows/apply-compact-ui.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Compatta analisi di popolazione ed Esplora"
          git push origin HEAD:feature/analysis-population-1.3.0
